  <body class="theme-dark">
    <div id="root" class="p-4 text-center">
      <h1 class="text-2xl font-bold mb-4">Loading RPR Schema Builder…</h1>
    </div>
  <!-- Tailwind safelist for dynamic spans used in builder -->
  <div class="hidden col-span-1 col-span-2 col-span-3 col-span-4 col-span-5 col-span-6 grid-cols-2 grid-cols-4 grid-cols-6 md:col-span-1 md:col-span-2 md:col-span-3"></div>

  <!-- React UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script>
    (() => {
      const h = React.createElement;
  const { useState, useMemo, useContext, createContext, useEffect, useRef, useCallback } = React;

      // Release flag: hide editing UX without removing underlying code
      const RELEASE_LOCK = true;

      const schemaCache = new Map();
      const schemaAlias = { Rune: "RuneDef" };
  const DEFAULT_DESCRIPTION_TEXT = "insert description here";

      function schemaMeta(table){
        const schema = window.SCHEMA?.[table];
        if (!schema) return undefined;
        let meta = schemaCache.get(table);
        if (!meta || meta.schema !== schema){
          const columns = Array.isArray(schema.columns) ? schema.columns : [];
          const literal = columns[0] || {};
          const indexByName = new Map();
          columns.forEach((col, idx)=> indexByName.set(String(col.name||""), idx));
          meta = { schema, columns, literal, count: columns.length, indexByName };
          schemaCache.set(table, meta);
        }
        return meta;
      }

      const clearSchemaCache = ()=> schemaCache.clear();

      // ========= helpers =========
      const int  = (v)=>{ const n = parseInt(v,10); return Number.isFinite(n)?n:0; };
      const num  = (v,d=0)=>{ const n = Number(v); return Number.isFinite(n)?n:d; };
      const tf   = (b)=> (b ? "t" : "f");
      const tfInv= (v)=> {
        const s = String(v).toLowerCase();
        if (s === "t") return true;
        if (s === "f") return false;
        // Handle numeric values: non-zero = true, zero = false
        if (isInt(v)) return Number(v) !== 0;
        return false;
      };

      const isInt  = (v)=> /^-?\d+$/.test(String(v).trim());
      const isNum  = (v)=> Number.isFinite(Number(v));
      const isTF   = (v)=> /^(t|f)$/i.test(String(v).trim());
      const isRGBA = (v)=> {
        if (typeof v !== "string") return false;
        const trimmed = v.trim();
        if (trimmed === "") return true;
        if (trimmed === "0" || trimmed === "0.0") return true;
        const p = trimmed.split(",").map(s=>s.trim());
        return p.length === 4 && p.every(isNum);
      };

      const createFormulaTestState = ()=> ({ inputs:{}, result:null, error:null, lastFormula:null });

      function extractFormulaVariables(input){
        if (typeof input !== "string" || !input.includes("{")) return [];
        const found = new Set();
        const regex = /\{([^{}]+)\}/g;
        let match;
        while ((match = regex.exec(input))){
          const key = (match[1] || "").trim();
          if (key) found.add(key);
        }
        return Array.from(found);
      }

      function formatFormulaNumber(value){
        if (!Number.isFinite(value)) return String(value);
        if (Number.isInteger(value)) return String(value);
        const rounded = Number(value.toFixed(3));
        if (Number.isInteger(rounded)) return String(rounded);
        const str = String(rounded);
        return str.includes(".") ? str.replace(/\.?0+$/, "") : str;
      }

      function evaluateFormulaForTest(expression, variableValues, rng = Math.random){
        if (typeof expression !== "string") throw new Error("Formula is missing.");
        const trimmed = expression.trim();
        if (!trimmed) throw new Error("Enter a formula before testing.");
        const text = trimmed;
        const length = text.length;
        let index = 0;
        const rolls = [];
        const random = typeof rng === "function" ? rng : Math.random;

        const isDigit = (ch)=> ch >= "0" && ch <= "9";
        const peek = ()=> index < length ? text[index] : null;
        const advance = ()=>{ if (index < length) index++; };
        const skipWhitespace = ()=>{ while (index < length && /\s/.test(text[index])) index++; };
        const error = (message)=>{
          const col = index + 1;
          return new Error(`${message} (position ${col})`);
        };

        const parseExpression = ()=>{
          let value = parseTerm();
          while (true){
            skipWhitespace();
            const ch = peek();
            if (ch === "+" || ch === "-"){
              advance();
              const rhs = parseTerm();
              value = ch === "+" ? value + rhs : value - rhs;
            } else {
              break;
            }
          }
          return value;
        };

        const parseTerm = ()=>{
          let value = parseFactor();
          while (true){
            skipWhitespace();
            const ch = peek();
            if (ch === "*" || ch === "/"){
              advance();
              const rhs = parseFactor();
              if (ch === "*"){
                value = value * rhs;
              } else {
                if (rhs === 0) throw error("Division by zero.");
                value = value / rhs;
              }
            } else {
              break;
            }
          }
          return value;
        };

        const parseFactor = ()=>{
          let value = parseUnary();
          while (true){
            skipWhitespace();
            const ch = peek();
            if (ch === "d" || ch === "D" || ch === "h" || ch === "H"){
              advance();
              const operator = ch.toLowerCase();
              const rhs = parseUnary();
              value = applyDice(operator, value, rhs);
            } else {
              break;
            }
          }
          return value;
        };

        const parseUnary = ()=>{
          skipWhitespace();
          const ch = peek();
          if (ch === "+"){
            advance();
            return +parseUnary();
          }
          if (ch === "-"){
            advance();
            return -parseUnary();
          }
          return parsePrimary();
        };

        const parsePrimary = ()=>{
          skipWhitespace();
          const ch = peek();
          if (ch === "("){
            advance();
            const value = parseExpression();
            skipWhitespace();
            if (peek() !== ")") throw error("Missing closing parenthesis.");
            advance();
            return value;
          }
          if (ch === "{"){
            return parseVariable();
          }
          if (looksLikeFunction()){
            return parseFunction();
          }
          if (ch === "." || isDigit(ch)){
            return parseNumber();
          }
          throw error(`Unexpected token "${ch ?? "end"}".`);
        };

        const parseNumber = ()=>{
          skipWhitespace();
          const start = index;
          let seenDigit = false;
          let seenDot = false;
          while (index < length){
            const ch = text[index];
            if (ch === "."){
              if (seenDot) break;
              seenDot = true;
              advance();
              continue;
            }
            if (!isDigit(ch)) break;
            seenDigit = true;
            advance();
          }
          if (!seenDigit && !seenDot) throw error("Expected number.");
          const slice = text.slice(start, index);
          const numeric = Number(slice);
          if (!Number.isFinite(numeric)) throw error("Invalid number literal.");
          return numeric;
        };

        const parseVariable = ()=>{
          advance();
          const start = index;
          while (index < length && text[index] !== "}") advance();
          if (index >= length) throw error("Variable is missing closing brace.");
          const raw = text.slice(start, index).trim();
          advance();
          if (!raw) throw error("Variable name cannot be empty.");
          if (!Object.prototype.hasOwnProperty.call(variableValues || {}, raw)){
            throw error(`Enter a value for {${raw}}.`);
          }
          const val = Number(variableValues[raw]);
          if (!Number.isFinite(val)) throw error(`Value for {${raw}} must be numeric.`);
          return val;
        };

        const looksLikeFunction = ()=>{
          if (index + 2 > length) return false;
          return text.slice(index, index + 2).toLowerCase() === "f.";
        };

        const parseFunction = ()=>{
          index += 2;
          const start = index;
          while (index < length){
            const ch = text[index];
            if (!/[a-z]/i.test(ch)) break;
            advance();
          }
          if (start === index) throw error("Expected function name after f.");
          const name = text.slice(start, index).toLowerCase();
          skipWhitespace();
          if (peek() !== "[") throw error(`Expected "[" after f.${name}.`);
          advance();
          const args = [];
          skipWhitespace();
          if (peek() !== "]"){
            while (true){
              const arg = parseExpression();
              args.push(arg);
              skipWhitespace();
              const next = peek();
              if (next === ","){
                advance();
                skipWhitespace();
                continue;
              }
              if (next === "]") break;
              throw error(`Expected "," or "]" in f.${name} arguments.`);
            }
          }
          if (peek() !== "]") throw error(`Missing closing "]" in f.${name}.`);
          advance();
          return applyFunction(name, args);
        };

        const applyFunction = (name, args)=>{
          switch (name){
            case "max":
              if (!args.length) throw error("f.max needs at least one argument.");
              return Math.max(...args);
            case "min":
              if (!args.length) throw error("f.min needs at least one argument.");
              return Math.min(...args);
            case "clamp":
              if (args.length !== 3) throw error("f.clamp expects value, min, max.");
              return Math.min(Math.max(args[0], args[1]), args[2]);
            case "abs":
              if (args.length !== 1) throw error("f.abs expects one value.");
              return Math.abs(args[0]);
            case "floor":
              if (args.length !== 1) throw error("f.floor expects one value.");
              return Math.floor(args[0]);
            case "ceil":
              if (args.length !== 1) throw error("f.ceil expects one value.");
              return Math.ceil(args[0]);
            case "round":
              if (args.length !== 1) throw error("f.round expects one value.");
              return Math.round(args[0]);
            default:
              throw error(`Unknown function f.${name}.`);
          }
        };

        const applyDice = (operator, leftValue, rightValue)=>{
          if (!Number.isFinite(leftValue)) throw error("Dice count must resolve to a number.");
          if (!Number.isFinite(rightValue)) throw error("Dice sides must resolve to a number.");
          const count = Math.max(0, Math.floor(Math.abs(leftValue)));
          const sides = Math.max(0, Math.floor(Math.abs(rightValue)));
          if (sides < 1) throw error("Dice sides must be at least 1.");
          if (count > 500) throw error("Dice count is limited to 500.");
          if (sides > 1000) throw error("Dice sides are limited to 1000.");
          const entry = {
            operator,
            count,
            sides,
            rolls: [],
            kept: [],
            notation: `${count}${operator}${sides}`
          };
          if (count === 0){
            entry.total = 0;
            rolls.push(entry);
            return 0;
          }
          for (let i = 0; i < count; i++){
            const roll = 1 + Math.floor(random() * sides);
            entry.rolls.push(roll);
          }
          if (operator === "h"){
            entry.kept = [...entry.rolls].sort((a,b)=> b - a);
            entry.total = entry.kept.reduce((sum,val)=> sum + val, 0);
          } else {
            entry.kept = [...entry.rolls];
            entry.total = entry.kept.reduce((sum,val)=> sum + val, 0);
          }
          rolls.push(entry);
          return entry.total;
        };

        const value = parseExpression();
        skipWhitespace();
        if (index < length) throw error(`Unexpected trailing input "${text.slice(index)}".`);
        return {
          value,
          rounded: Math.round(value),
          rolls
        };
      }

      const LAYOUT_CANVAS_WIDTH = 1280;
      const LAYOUT_GRID_COLUMNS = 16; // 0.25 column increments across 4-column base
      const LAYOUT_GRID_COLUMN_WIDTH = LAYOUT_CANVAS_WIDTH / LAYOUT_GRID_COLUMNS;
      const LAYOUT_GRID_ROW_HEIGHT = 64;

      // The SCHEMA is now loaded dynamically from schema.json
      // window.SCHEMA will hold the configuration

      // Augment schema at runtime with SpellEffect mapping if it's not present yet
      (function installSpellEffectSchema(){
        function defineSpellEffect(){
          if (!window || !window.SCHEMA) return false;

          const enumMap = (obj)=> Object.fromEntries(Object.entries(obj).map(([k,v])=>[String(k), String(v)]));
          const blueprint = [
            { name: "Literal", type: "literal", value: "SpellEffect" },
            // Include SpellID so SpellEffect rows can be associated with SpellDef and filtered as children
            { name: "SpellID", type: "int", default: 0 },
            { name: "ID", type: "int", default: 0 },
            { name: "Who", type: "int", enum: enumMap({ 0:"Target", 1:"All Targets", 2:"Caster" }), default: 0 },
            { name: "Function", type: "int", enum: enumMap({
              0:"Print Message",
              1:"Modify Stat",
              2:"Give Base Game Item",
              3:"Remove Base Game Item",
              4:"Buff Skill",
              5:"Buff Stat",
              6:"Buff Perk",
              7:"Dispel Buff",
              8:"Buff Ability",
              9:"Auto Use Ability",
              10:"Set Stat",
              11:"Buff Grant Status",
              12:"Buff Unlock Status"
            }), default: 0 },
            { name: "AdjustFormula", default: "" },
            { name: "TargetID", type: "int", default: 0 },
            { name: "If", type: "int", enum: enumMap({ 0:"Always", 1:"Critical Only", 2:"Non-Critical Only" }), default: 0 },
            { name: "Broadcast", type: "int", enum: enumMap({ 0:"Public", 1:"Private", 2:"Secret" }), default: 0 },
            { name: "Outcome", type: "int", enum: enumMap({ 0:"General Effect", 1:"Success Effect", 2:"Failure Effect" }), default: 0 },
            { name: "DurationFormula", default: "" },
            { name: "Category", default: "" },
            { name: "DelayFormula", default: "" },
            { name: "Unused", type: "int", default: 1 }
          ];

          const existing = window.SCHEMA.SpellEffect;
          if (existing && Array.isArray(existing.columns)){
            const existingMap = new Map(existing.columns.map(col => [String(col?.name||""), col]));
            const nextCols = [];
            blueprint.forEach(def => {
              const found = existingMap.get(def.name);
              if (found){
                const merged = { ...found };
                // Preserve literal value when present, otherwise merge blueprint typing/defaults/enums
                Object.keys(def).forEach(key =>{
                  if (key === "name") return;
                  merged[key] = def[key];
                });
                nextCols.push(merged);
              } else {
                nextCols.push({ ...def });
              }
            });
            existing.columns.forEach(col =>{
              const key = String(col?.name||"");
              if (!blueprint.some(def => def.name === key)) nextCols.push(col);
            });
            window.SCHEMA.SpellEffect = { ...existing, columns: nextCols };
            return true;
          }

          const columns = blueprint;

          const toLine = (rec)=>{
            const vals = [];
            for (const col of columns){
              let v;
              if (col.type === "literal") v = col.value;
              else v = (rec && rec[col.name] !== undefined) ? rec[col.name] : (col.default !== undefined ? col.default : "");
              if (col.type === "int" || col.type === "number") {
                v = (v === "" || v === null || v === undefined) ? "" : String(Number(v));
              } else {
                v = String(v ?? "");
              }
              vals.push(v);
            }
            return vals.join("|");
          };

          const fromLine = (parts)=>{
            const rec = {};
            for (let i=0;i<columns.length;i++){
              const col = columns[i];
              const raw = parts[i];
              if (col.type === "literal") { rec[col.name] = col.value; continue; }
              if (col.type === "int") rec[col.name] = raw === "" ? "" : Number(raw);
              else if (col.type === "number") rec[col.name] = raw === "" ? "" : Number(raw);
              else rec[col.name] = raw;
            }
            return rec;
          };

          window.SCHEMA.SpellEffect = { columns, toLine, fromLine, ui: { columns: 2 } };
          return true;
        }

        if (!defineSpellEffect()){
          // Try again shortly in case schema.json loads after this script block
          let tries = 0;
          const t = setInterval(()=>{
            tries++;
            if (defineSpellEffect() || tries > 50) clearInterval(t); // ~5s max at 100ms
          }, 100);
        }
      })();

      // ========= validation & parsing =========
      function validateParts(table, parts, lineNo){
        const meta = schemaMeta(table);
        if(!meta) return { ok:false, error:`[line ${lineNo}] Unknown table "${table}"` };
        const lit = meta.columns[0];
        if(parts[0] !== lit.value) return { ok:false, error:`[line ${lineNo}] Expected literal "${lit.value}", got "${parts[0]}"` };
        if(parts.length !== meta.count) return { ok:false, error:`[line ${lineNo}] ${table}: expected ${meta.count} columns, got ${parts.length}` };
        for(let i=0;i<meta.columns.length;i++){
          const col = meta.columns[i], raw = parts[i];
          switch(col.type){
            case "literal": if(raw!==col.value) return { ok:false, error:`[line ${lineNo}] ${table}.${col.name}: expected literal "${col.value}"` }; break;
            case "int":     if(String(raw).trim()==="") break; if(!isInt(raw))     return { ok:false, error:`[line ${lineNo}] ${table}.${col.name}: expected int, got "${raw}"` }; break;
            case "number":  if(String(raw).trim()==="") break; if(!isNum(raw))     return { ok:false, error:`[line ${lineNo}] ${table}.${col.name}: expected number, got "${raw}"` }; break;
            case "bool_tf": 
              if(!isTF(raw)) {
                // Allow numeric values for bool_tf fields, treating non-zero as "t" and zero as "f"
                if(isInt(raw)) {
                  // Will be converted by tfInv in fromLine - this is just validation
                  break;
                }
                return { ok:false, error:`[line ${lineNo}] ${table}.${col.name}: expected t/f, got "${raw}"` };
              }
              break;
            case "rgba":    if(!isRGBA(raw))    return { ok:false, error:`[line ${lineNo}] ${table}.${col.name}: expected r,g,b,a (numbers)` }; break;
            case "enum":    {
              const nameLower = String(col.name||"").toLowerCase();
              const inEnum = (raw in (col.enum||{}));
              const sourceType = typeof col.sourceType === "string" ? col.sourceType.toLowerCase() : "";
              const relaxedEnum = sourceType.includes("string");
              const trimmedRaw = String(raw ?? "").trim();
              // Relax validation for numeric codes in action-like tables and other enum fields that may have incomplete schema mappings
              const looksFunction = nameLower.includes("function") || nameLower.includes("funcion");
              const looksRollType = /rolltype/i.test(String(col.name||""));
              const looksDCType = /dctype/i.test(String(col.name||""));
              const numericToken = isInt(raw);
              if (!inEnum) {
                if (relaxedEnum) {
                  // Permit free-form string values when the original schema declared string-based storage
                  break;
                }
                if ((looksFunction || looksRollType || looksDCType) && numericToken) {
                  // accept numeric codes even if not listed in enum for Function, RollType, and DCType fields
                  break;
                }
                return { ok:false, error:`[line ${lineNo}] ${table}.${col.name}: unexpected "${raw}"` };
              }
              break;
            }
            case "empty":   if(String(raw).trim()!="")        return { ok:false, error:`[line ${lineNo}] ${table}.${col.name}: expected empty cell` }; break;
            default: break;
          }
        }
        return { ok:true };
      }

      function parseLine(line, lineNo) {
        let parts = line.split("|").map(s=> String(s).replace(/[\u200B-\u200D\uFEFF]/g,"").trim());
        let tag = parts[0];
        let schemaParts = parts.slice();

        if (schemaAlias[tag] && schemaMeta(schemaAlias[tag])) {
          tag = schemaAlias[tag];
        }

        let meta = schemaMeta(tag);

        if (!meta){
          const candidates = ["Stat","RuneDef","SkillDef"];
          for (const candidate of candidates){
            const candidateMeta = schemaMeta(candidate);
            if (candidateMeta && parts.length === candidateMeta.count - 1){
              tag = candidate;
              schemaParts = [candidate, ...parts];
              meta = candidateMeta;
              break;
            }
          }
          if (!meta){
            throw new Error(`[line ${lineNo}] Unknown table literal or incorrect column count for prefix-less entry: "${parts[0]}"`);
          }
        }

        if (tag === "SpellEffect"){
          if (schemaParts.length >= 4 && schemaParts.length < meta.count){
            schemaParts = [
              schemaParts[0],
              schemaParts[1],
              schemaParts[2],
              "0",
              ...schemaParts.slice(3)
            ];
          }
        }

        if (tag === "SpellReqDef" && schemaParts.length === meta.count - 1){
          schemaParts.push("");
        }

        if (meta.columns.length){
          const want = meta.count;
          if (schemaParts.length > want){
            const trimmed = schemaParts.slice();
            while (trimmed.length > want && String(trimmed[trimmed.length-1]).trim() === "") trimmed.pop();
            if (trimmed.length > want){
              const safeCrop = new Set(["SpellReqDef","RuneCondition","SpellTargetCond","MutatorCondition","MutatorAction","StatusAction","PerkAction","RuneAction","SpellEffect"]);
              if (safeCrop.has(tag)){
                schemaParts = trimmed.slice(0, want);
              } else if (trimmed.length === want) {
                schemaParts = trimmed;
              }
            } else if (trimmed.length === want) {
              schemaParts = trimmed;
            }
          }
          if (schemaParts.length < want){
            const padded = schemaParts.slice();
            while (padded.length < want) padded.push("");
            schemaParts = padded;
          }
        }

        if (tag === "MutatorAction"){
          const mutMeta = schemaMeta("MutatorAction");
          if (mutMeta){
            const want = mutMeta.count;
            if (schemaParts.length === 5 && want >= 7){
              const [lit, mid, fn, tgt, val] = schemaParts;
              schemaParts = [lit, mid, "0", tgt, fn, val, "0"];
              while (schemaParts.length < want) schemaParts.push("0");
            }
          }
        }

        if (tag === "SpellReqDef"){
          const opIdx = meta.columns.findIndex(c=> c.name==="Operator" || c.name==="Boolean");
          if (opIdx > 0 && schemaParts.length > opIdx){
            const map = {"==":"0","!=":"1",">":"2",">=":"3","<":"4","<=":"5","Between":"6","Outside":"7"};
            schemaParts = schemaParts.map((v,i)=> i===0? v : String(v).replace(/\u00A0/g,' ').trim());
            const tok = schemaParts[opIdx];
            const enumMapRef = meta.columns[opIdx].enum || {};
            if (!(tok in enumMapRef) && (tok in map)) schemaParts[opIdx] = map[tok];
          }
        }

        if (["MutatorCondition","RuneCondition","SpellTargetCond","SpellReqDef"].includes(tag)){
          const opIdx = meta.columns.findIndex(c=> c.name==="Operator" || c.name==="Boolean");
          const paramIdx = meta.columns.findIndex(c=> c.name==="Param" || /Assoc/i.test(String(c.name||"")));
          if (opIdx > -1 && paramIdx > -1 && schemaParts.length > Math.max(opIdx, paramIdx)){
            const rawOp = schemaParts[opIdx];
            if (/^-?\d+$/.test(String(rawOp))){
              const n = Number(rawOp);
              if (Number.isFinite(n) && n > 7){
                const curParam = schemaParts[paramIdx];
                if (curParam === undefined || String(curParam).trim() === ""){
                  schemaParts[paramIdx] = String(n);
                  schemaParts[opIdx] = "0";
                }
              }
            }
          }
        }

        const validation = validateParts(tag, schemaParts, lineNo);
        if (!validation.ok) throw new Error(validation.error);
        return { table: tag, record: meta.schema.fromLine(schemaParts) };
      }

      function toText(all, mirror){
        const order = Object.keys(window.SCHEMA || {});
        const lines = [];
        for(const t of order){ 
          const meta = schemaMeta(t);
          if (!meta || !all[t]) continue;
          all[t].forEach(r=> {
            let line;
            if (mirror && t === "SkillDef"){
              // When mirroring, export attributes with AttributeDef literal
              const isAttr = String(r.TypeFlag||"").toLowerCase()==="t";
              const attrMeta = schemaMeta("AttributeDef");
              if (isAttr && attrMeta){
                line = attrMeta.schema.toLine(r);
              } else {
                line = meta.schema.toLine(r);
              }
              // Pad trailing blanks for mirrored AttributeDef rows
              const tagUsed = (isAttr && attrMeta) ? "AttributeDef" : t;
              const cfgOut = schemaMeta(tagUsed)?.schema;
              const UNSAFE_SPLIT = new Set(["SpellDef"]); // do not split tables that may embed '|'
              if (cfgOut && Array.isArray(cfgOut.columns) && !UNSAFE_SPLIT.has(tagUsed)){
                const want = cfgOut.columns.length;
                const have = String(line).split("|").length;
                if (have < want) line = line + "|".repeat(want - have);
              }
            } else {
              line = meta.schema.toLine(r);
              // Pad trailing blanks to match schema column count
              const cfgOut = meta.schema;
              if (cfgOut && Array.isArray(cfgOut.columns)){
                const want = cfgOut.columns.length;
                const have = String(line).split("|").length;
                if (have < want) line = line + "|".repeat(want - have);
              }
            }
            lines.push(line);
          }); 
        }
        return lines.join("\n");
      }

            panelX: position.x,
            panelY: position.y
          });
        };
        
        const handleMouseMove = (e) => {
          if (!isDragging) return;

          const deltaY = e.clientY - dragStart.y;

            y: dragStart.panelY + deltaY

        function buildDefaultRecord(tableName){
          const sc = schema[tableName];
          const rec = {};
          (sc.columns||[]).forEach(c=>{
            if(c.type==="literal") rec[c.name]=c.value;
            else if(Object.prototype.hasOwnProperty.call(c, "default")){
              switch(c.type){
                case "int":
                case "number": rec[c.name] = Number(c.default); break;
                case "bool_tf": rec[c.name] = tfInv(c.default); break;
                default: rec[c.name] = c.default;
              }
            }
          });
          return rec;
        }

          const overrides = typeof parentDefaults === "function" ? (parentDefaults()||{}) : (parentDefaults||{});

          // Global auto-increment across ALL categories for primary ID fields
          try{
            // Determine the ID field name for this table ("Node ID" or "ID")
            if ((cfg.columns||[]).some(c => c.name === "Node ID")) primaryIdField = "Node ID";
            else if ((cfg.columns||[]).some(c => c.name === "ID")) primaryIdField = "ID";

            if (primaryIdField) {
              // Compute global max across all top-level tables that have an ID-like field
              let globalMax = 0;
              const tables = Object.keys(schema||{});
              for (const t of tables) {
                if (t === "AttributeDef") continue; // synthetic mirror, skip
                const sc = schema[t];
                if (!sc || !Array.isArray(sc.columns)) continue;
                let tIdField = null;
                if (sc.columns.some(c => c.name === "Node ID")) tIdField = "Node ID";
                else if (sc.columns.some(c => c.name === "ID")) tIdField = "ID";
                if (!tIdField) continue;
                const arr = Array.isArray(all?.[t]) ? all[t] : [];
                for (const r of arr) {
                  const n = Number(r[tIdField]);
                  if (Number.isFinite(n)) globalMax = Math.max(globalMax, n);
                }
              }
              seeded[primaryIdField] = globalMax + 1;
            }
          } catch(_e) {}

          // Post-increment seeding: table-specific clean defaults and naming
          try{
            // Name autofill rules: Skills -> "Skill {NodeID}", Abilities -> "Ability {ID}"

                    defaults:(p)=>({ MutatorID:p.ID, Mode:0, Function:0, Operator:0, Param:0, ValueMin:0, ValueMax:0 })
                  }
                ],
                currentTab: "Mutators",
                layoutMode,
                schemaVersion,
                onLayoutChange:handleLayoutChange,
                onLayoutSeed:seedLayoutForTable,
                onLayoutReset:resetLayoutForTable,
                onLayoutLockChange:setLayoutLockedForTable,
                onLabelChange:setFieldLabelForTable
              })
            ),
            tab==="Raw" && h(CategoryBox,{title:"Raw Editor", tipText:tips.Raw, onTipChange:(v)=>setTips({...tips, Raw:v})},
              h("div",{className:"space-y-2"},
                h("textarea",{className:"w-full h-60 border rounded p-2 font-mono text-xs", value:raw, onChange:(e)=>setRaw(e.target.value), placeholder:"Paste RPR pipe-delimited lines here…"}),
                h("div",{className:"flex gap-2"},
                  h("button",{className:"px-3 py-1 border rounded", onClick:importRaw},"Import from Raw"),
                  h("button",{className:"px-3 py-1 border rounded", onClick:()=>setRaw(toText(data, mirror))},"Populate Raw from Panels"),
                  h("button",{className:"px-3 py-1 border rounded", onClick:loadText},"Load from File")
                ),
                errors.length>0 && h("div",{className:"border rounded p-3 text-sm bg-red-50 text-red-800"},
                  h("div",{className:"font-semibold mb-1"}, `Import rejected: ${errors.length} issue(s)`),
                  h("ul",{className:"list-disc pl-5 space-y-0.5"}, errors.map((e,i)=> h("li",{key:i},e)))
                ),
                h("div",{className:"flex gap-2 pt-2"},
                  h("button",{className:"px-3 py-1 border rounded", onClick:exportText},"Save Text"),
                  h("button",{className:"px-3 py-1 border rounded", onClick:exportJson},"Save JSON"),
                  h("button",{className:"px-3 py-1 border rounded", onClick:resumeLast},"Resume")
                )
              )
            )
          )
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(React.createElement(App));
    })();
    </script>
  </body>
</html>
